# https://herdr.dev/docs/configuration/

onboarding = false

# ── terminal ──────────────────────────────────────────────────────────
[terminal]
default_shell = "fish"

# ── keys ──────────────────────────────────────────────────────────────
[keys]
prefix = "ctrl+b"

[[keys.command]]
key = "prefix+p"
type = "plugin_action"
command = "ray.plugin-manager.open"
description = "open plugin manager"

[[keys.command]]
key = ["prefix+u", "prefix+shift+u"]
type = "plugin_action"
command = "herdr-pacer.dock-toggle"
description = "show or hide the usage dock"

# ── theme ─────────────────────────────────────────────────────────────
[theme]
name = "catppuccin"
auto_switch = true

# ── theme.custom ──────────────────────────────────────────────────────
# theme.custom.accent and ui.accent (below) are two separate config keys per
# herdr's own docs (theme.custom.accent overrides the active theme's accent
# token; ui.accent is its own default="cyan" setting for highlights/borders/
# nav specifically) — not documented as aliases of each other. Both are set
# to the same lavender here on purpose, for a visually consistent look; keep
# them in sync if this ever changes.
[theme.custom]
accent = "#b4befe"           # mocha lavender — pane borders, active tab, highlights

# ── ui ────────────────────────────────────────────────────────────────
[ui]
# visible pane outlines — explicit since the defaults weren't showing up
pane_borders = "always"
pane_outer_borders = true
pane_gaps = true
accent = "#b4befe"
prompt_new_tab_name = false
# The herdr-pacer tabbar segments below embed a per-install path hash
# (.../herdr-pacer-16ea3a7d9705/...) — regenerated automatically by
# `herdr plugin action invoke herdr-pacer.setup` on a fresh install, not
# something to hand-edit or try to make portable (herdr-pacer isn't on
# $PATH, so this absolute path is the only thing that currently works).
tab_bar_right = [
  { type = "zoom" },
  { type = "command", command = "~/.config/herdr/status.sh", interval_seconds = 60, timeout_seconds = 2 },
  { type = "hostname" },
  { type = "datetime", format = "%H:%M" },
  { type = "command", command = "'/Users/amogh/.config/herdr/plugins/github/herdr-pacer-16ea3a7d9705/target/release/herdr-pacer' tabbar openai-codex", interval_seconds = 30, timeout_seconds = 3 },
  { type = "command", command = "'/Users/amogh/.config/herdr/plugins/github/herdr-pacer-16ea3a7d9705/target/release/herdr-pacer' tabbar claude", interval_seconds = 30, timeout_seconds = 3 },
  { type = "command", command = "'/Users/amogh/.config/herdr/plugins/github/herdr-pacer-16ea3a7d9705/target/release/herdr-pacer' tabbar opencode-go", interval_seconds = 30, timeout_seconds = 3 },
]
tab_bar_right_separator = " · "

agent_panel_sort = "spaces"

[ui.toast]
delivery = "system"

[ui.sidebar]

[ui.sidebar.agents]
rows = [
  ["state_icon", "machine", "workspace", "tab"],
  ["agent"],
  [{ token = "$pacer_ctx_ok", fg = "#a6e3a1" }, { token = "$pacer_ctx_warn", fg = "#f9e2af" }, { token = "$pacer_ctx_hot", fg = "#fab387" }, { token = "$pacer_ctx_crit", fg = "#f38ba8" }, { token = "$pacer_ctx", fg = "#585b70" }],
  [{ token = "$pacer_5h_ok", fg = "#a6e3a1" }, { token = "$pacer_5h_warn", fg = "#f9e2af" }, { token = "$pacer_5h_hot", fg = "#fab387" }, { token = "$pacer_5h_crit", fg = "#f38ba8" }, { token = "$pacer_5h", fg = "#585b70" }],
  [{ token = "$pacer_wk_ok", fg = "#a6e3a1" }, { token = "$pacer_wk_warn", fg = "#f9e2af" }, { token = "$pacer_wk_hot", fg = "#fab387" }, { token = "$pacer_wk_crit", fg = "#f38ba8" }, { token = "$pacer_wk", fg = "#585b70" }],
]
