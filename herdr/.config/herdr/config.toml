# https://herdr.dev/docs/configuration/

onboarding = false

# ── terminal ──────────────────────────────────────────────────────────
[terminal]
default_shell = "fish"

# ── keys ──────────────────────────────────────────────────────────────
[keys]
prefix = "ctrl+b"

[[keys.command]]
key = "prefix+p"
type = "plugin_action"
command = "ray.plugin-manager.open"
description = "open plugin manager"

[[keys.command]]
key = ["prefix+u", "prefix+shift+u"]
type = "plugin_action"
command = "herdr-pacer.dock-toggle"
description = "show or hide the usage dock"

[[keys.command]]
key = "prefix+a"
type = "plugin_action"
command = "herdr-pacer.subagents-toggle"
description = "show or hide Claude's subagents in the Agents list"

# ── theme ─────────────────────────────────────────────────────────────
[theme]
name = "catppuccin"
auto_switch = true

# ── theme.custom ──────────────────────────────────────────────────────
# theme.custom.accent and ui.accent (below) are two separate config keys per
# herdr's own docs (theme.custom.accent overrides the active theme's accent
# token; ui.accent is its own default="cyan" setting for highlights/borders/
# nav specifically) — not documented as aliases of each other. Both are set
# to the same lavender here on purpose, for a visually consistent look; keep
# them in sync if this ever changes.
[theme.custom]
accent = "#b4befe"           # mocha lavender — pane borders, active tab, highlights

# ── ui ────────────────────────────────────────────────────────────────
[ui]
# visible pane outlines — explicit since the defaults weren't showing up
pane_borders = "always"
pane_outer_borders = true
pane_gaps = true
accent = "#b4befe"
prompt_new_tab_name = false
tab_bar_right = [
  { type = "zoom" },
  { type = "command", command = "~/.config/herdr/status.sh", interval_seconds = 60, timeout_seconds = 2 },
  { type = "hostname" },
  { type = "datetime", format = "%H:%M" },
]
# herdr-pacer's setup action appends 1-3 more "tabbar" command segments here,
# one per detected agent CLI (openai-codex/claude/opencode-go) — deliberately
# NOT tracked. Each one bakes in an absolute, per-machine, per-install path
# (username + a plugin install hash + an install-instance id), so committing
# whatever one machine's setup wrote would point at a path that doesn't exist
# on any other machine. After `git pull` + `stow -R -t ~ herdr` on a new
# machine, re-run `herdr plugin action invoke herdr-pacer.setup` locally to
# regenerate these for that machine, then DO NOT commit the result — strip
# them back out (or `git checkout -- herdr/.config/herdr/config.toml` the
# tab_bar_right block) before committing anything else in this file.
tab_bar_right_separator = " · "

agent_panel_sort = "spaces"

[ui.toast]
delivery = "system"

[ui.sidebar]

[ui.sidebar.agents]
# herdr-pacer v0.12.0 regenerated this block (was the older ctx/5h/wk-only
# layout). "$pacer_lines_ctx"/"_5h"/"_wk" are plain row labels, NOT a new
# state scheme — the real $pacer_ctx_*/$pacer_5h_*/$pacer_wk_* state tokens
# are unchanged, just joined by a new identity row ($pacer_branch/$pacer_name/
# $pacer_repo). Colors recolored from pacer's defaults to Catppuccin Mocha
# (same green/yellow/peach/red/surface2 mapping used everywhere else here).
rows = [
  [{ token = "$pacer_branch", fg = "#585b70" }, "state_icon", { token = "$pacer_name", fg = "#b4befe", bold = true }, { token = "$pacer_repo", fg = "#585b70" }],
  [{ token = "$pacer_lines_ctx", fg = "#585b70" }, { token = "$pacer_ctx_ok", fg = "#a6e3a1" }, { token = "$pacer_ctx_warn", fg = "#f9e2af" }, { token = "$pacer_ctx_hot", fg = "#fab387" }, { token = "$pacer_ctx_crit", fg = "#f38ba8" }, { token = "$pacer_ctx", fg = "#585b70" }],
  [{ token = "$pacer_lines_5h", fg = "#585b70" }, { token = "$pacer_5h_ok", fg = "#a6e3a1" }, { token = "$pacer_5h_warn", fg = "#f9e2af" }, { token = "$pacer_5h_hot", fg = "#fab387" }, { token = "$pacer_5h_crit", fg = "#f38ba8" }, { token = "$pacer_5h", fg = "#585b70" }],
  [{ token = "$pacer_lines_wk", fg = "#585b70" }, { token = "$pacer_wk_ok", fg = "#a6e3a1" }, { token = "$pacer_wk_warn", fg = "#f9e2af" }, { token = "$pacer_wk_hot", fg = "#fab387" }, { token = "$pacer_wk_crit", fg = "#f38ba8" }, { token = "$pacer_wk", fg = "#585b70" }],
]
