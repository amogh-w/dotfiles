# https://herdr.dev/docs/configuration/

onboarding = false

# ── terminal ──────────────────────────────────────────────────────────
[terminal]
default_shell = "/opt/homebrew/bin/fish"

# ── keys ──────────────────────────────────────────────────────────────
[keys]
prefix = "ctrl+b"

[[keys.command]]
key = "prefix+p"
type = "plugin_action"
command = "ray.plugin-manager.open"
description = "open plugin manager"

[[keys.command]]
key = ["prefix+u", "prefix+shift+u"]
type = "plugin_action"
command = "herdr-pacer.dock-toggle"
description = "show or hide the usage dock"

# ── theme ─────────────────────────────────────────────────────────────
[theme]
name = "catppuccin"
auto_switch = true
#light_name = "catppuccin-latte"
#dark_name = "catppuccin"

# ── theme.custom ──────────────────────────────────────────────────────
# VS Code Dark Modern's explorer/editor/selection layout, remapped onto
# catppuccin mocha tones, lavender accent
[theme.custom]
# sidebar_bg = "#181825"       # mocha mantle — lighter than crust, still recessed vs. the panel
# panel_bg = "#1e1e2e"         # mocha base — pane/editor area
# active_row_bg = "#313244"    # mocha surface0 — hovered/active sidebar row
# selection_bg = "#45475a"     # mocha surface1 — text selection
accent = "#b4befe"           # mocha lavender — pane borders, active tab, highlights

# ── ui ────────────────────────────────────────────────────────────────
[ui]
# visible pane outlines — explicit since the defaults weren't showing up
pane_borders = "always"
pane_outer_borders = true
pane_gaps = true
accent = "#b4befe"
prompt_new_tab_name = false
tab_bar_right = [
  { type = "zoom" },
  { type = "command", command = "~/.config/herdr/status.sh", interval_seconds = 60, timeout_seconds = 2 },
  { type = "hostname" },
  { type = "datetime", format = "%H:%M" },
]
tab_bar_right_separator = " · "

agent_panel_sort = "spaces"

[ui.toast]
delivery = "system"

[ui.sidebar]

[ui.sidebar.agents]
rows = [
  ["state_icon", "machine", "workspace", "tab"],
  ["agent"],
  [{ token = "$pacer_ctx_ok", fg = "#a6e3a1" }, { token = "$pacer_ctx_warn", fg = "#f9e2af" }, { token = "$pacer_ctx_hot", fg = "#fab387" }, { token = "$pacer_ctx_crit", fg = "#f38ba8" }, { token = "$pacer_ctx", fg = "#585b70" }],
  [{ token = "$pacer_5h_ok", fg = "#a6e3a1" }, { token = "$pacer_5h_warn", fg = "#f9e2af" }, { token = "$pacer_5h_hot", fg = "#fab387" }, { token = "$pacer_5h_crit", fg = "#f38ba8" }, { token = "$pacer_5h", fg = "#585b70" }],
  [{ token = "$pacer_wk_ok", fg = "#a6e3a1" }, { token = "$pacer_wk_warn", fg = "#f9e2af" }, { token = "$pacer_wk_hot", fg = "#fab387" }, { token = "$pacer_wk_crit", fg = "#f38ba8" }, { token = "$pacer_wk", fg = "#585b70" }],
]
